# Monitor
# Layout managed by nwg-displays (writes monitors.conf). Run: nwg-displays
source = ~/.config/hypr/monitors.conf
monitor = HDMI-A-1, 3840x2160@30, auto-right, 2
# Runtime mirror/extend from scripts/display-toggle.sh (tmpfs: cleared on logout). Usually absent.
# hyprlang noerror true
source = /run/user/1000/hypr-display-override*.conf
# hyprlang noerror false
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/glass.conf

# Default apps
$terminal = kitty
$menu = rofi -show drun

# Autostart
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = thunar --daemon
# MacShell: menu bar, Dock, Spotlight, notifications (replaces waybar + dunst). Loop restarts it if it crashes.
exec-once = sh -c 'while :; do qs -c MacShell; sleep 1; done'
exec-once = blueman-applet
exec-once = bluetoothctl power off

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Workspaces
workspace = 10, monitor:HDMI-A-1, default:true

# Environment
env = WLR_DRM_NO_ATOMIC,0
env = XCURSOR_SIZE,24
env = SSH_AUTH_SOCK,/run/user/1000/keyring/ssh
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic-Hypr
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,iHD
# No NVIDIA GPU here (Intel UHD 620 only): GBM_BACKEND=nvidia-drm / __GLX_VENDOR_LIBRARY_NAME=nvidia made
# apps load NVIDIA's EGL instead of Mesa's iris driver, which made workspace switches drop to ~30 fps.
env = CHROME_EXTRA_FLAGS,--force-device-scale-factor=1
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:$XDG_DATA_DIRS


cursor {
    no_hardware_cursors = true
}

# Input
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        scroll_factor = 0.3
    }
}

# Keybinds
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, grave, exec, kitten quick-access-terminal
bind = $mod, Escape, killactive
bind = $mod, M, exit
bind = $mod, E, exec, thunar
bind = $mod, T, exec, ~/.config/hypr/scripts/float-toggle.sh
bindr = SUPER, SUPER_L, exec, qs -c MacShell ipc call spotlight toggle
bind = $mod, period, exec, qs -c MacShell ipc call spotlight emoji
bind = ALT, Tab, exec, qs -c MacShell ipc call switcher next
bind = ALT SHIFT, Tab, exec, qs -c MacShell ipc call switcher prev
bind = $mod, F, fullscreen
bind = $mod, O, exec, pamac-manager
# bind = $mod, R, exec, rofi -show run

# Move focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Screenshot

# Mouse window drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize: drag borders/gaps directly, or SUPER+CTRL+arrows (hold to repeat)
general {
    resize_on_border = true
}
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Theming
env = GTK_THEME,catppuccin-mocha
env = QT_QPA_PLATFORMTHEME,qt6ct
# macOS app icons for MacShell only (Dock, Spotlight); GTK/Qt apps keep their theme
env = QS_ICON_THEME,MacOS-Like-Dark
bind = $mod, D, workspace, empty
exec-once = awww-daemon
exec-once = ~/.config/hypr/scripts/wallpaper.sh --restore
exec-once = ~/.config/hypr/scripts/wallpaper-hotplug.sh
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
bind = $mod, L, exec, hyprlock
bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper.sh --random
bind = $mod SHIFT, W, exec, qs -c MacShell ipc call wallpapers toggle

# Screenshots (MacShell): region / whole screen / window, saved to ~/Pictures/Screenshot
bind = , Print, exec, qs -c MacShell ipc call screenshot region
bind = SHIFT, Print, exec, qs -c MacShell ipc call screenshot screen
bind = $mod, Print, exec, qs -c MacShell ipc call screenshot window
# No close animation for the slurp/hyprpicker overlays, or grim captures them mid-slide
layerrule = match:namespace ^(selection|hyprpicker)$, no_anim on

# Clipboard history daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Open clipboard history with Super+V
bind = SUPER, V, exec, qs -c MacShell ipc call spotlight clipboard

# Delete a clipboard entry with Super+Shift+V
bind = SUPER SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist delete

# Power menu with Super+Delete
bind = SUPER, Delete, exec, pkill -x wlogout || GTK_THEME=Adwaita:dark wlogout -b 5 -c 0 -r 0 -L 360 -R 360 -T 400 -B 400 -l ~/.config/wlogout/layout -C ~/.config/wlogout/style.css

# Display management
bind = $mod, P, exec, ~/.config/hypr/scripts/display-toggle.sh extend
bind = $mod SHIFT, P, exec, ~/.config/hypr/scripts/display-toggle.sh mirror
bind = $mod CTRL, P, exec, ~/.config/hypr/scripts/display-toggle.sh reset
bind = $mod ALT, P, exec, nwg-displays

# Volume keys
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

# Touchpad gestures - 3 finger swipe left/right switches workspace
gesture = 3, horizontal, workspace


# Ignore kitty maximize requests so it tiles/splits
windowrule = match:class ^(kitty)$, suppress_event maximize fullscreen
windowrule = match:class ^(thunar)$, float on, size (monitor_w*0.5) (monitor_h*0.55), center on
windowrule = match:class ^($terminal)$, float on, size (monitor_w*0.5) (monitor_h*0.55), center on
windowrule = match:title ^(macshell Settings)$, float on, center on
source = ~/.config/hypr/plugins.conf
