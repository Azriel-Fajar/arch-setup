# Plugins are built and enabled with hyprpm (see docs/). This loads the enabled ones,
# then reloads so the guarded options below are applied with the plugins present.
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
# hyprglass comes from a local fork (~/.local/src/HyprGlass, MacShell shapes + displacement rim):
# swap hyprpm's copy for it before the reload. Rebuild the fork after a Hyprland update.
exec-once = hyprpm reload -n; hyprctl plugin unload /var/cache/hyprpm/azriel/HyprGlass/hyprglass.so; hyprctl plugin load ~/.local/share/hyprglass-macshell/hyprglass.so; hyprctl reload
# Liquid glass on floating windows only; tiled windows keep Hyprland's blur (readability)
exec-once = ~/.config/hypr/scripts/glass-float-sync.sh

# Plugin options/rules/dispatchers are unknown until hyprpm has loaded the plugins
# (first parse at login, or a plugin that failed to build). Don't raise errors for them.
# hyprlang noerror true

plugin {
    hyprbars {
        enabled = true
        bar_height = 28
        bar_color = $bar_bg
        col.text = $on_surface
        # hyprbars blurs a square rect that ignores window rounding (pointy corners)
        bar_blur = false
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_size = 10
        bar_text_align = center
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 10
        bar_button_padding = 8
        icon_on_hover = true
        inactive_button_color = $outline_dim
        on_double_click = hyprctl dispatch fullscreen 1
        # buttons are listed right to left: bgcolor, size, icon, on-click, fgcolor
        hyprbars-button = $error, 13, 󰖭, hyprctl dispatch killactive, $surface
        hyprbars-button = $tertiary, 13, 󰖯, ~/.config/hypr/scripts/maximize.sh, $surface
        hyprbars-button = $primary, 13, 󰖰, ~/.config/hypr/scripts/minimize.sh, $surface
    }

    hyprfocus {
        enable = true
        # shrink also fires when closing a window refocuses the one behind (twitch)
        keyboard_focus_animation = flash
        mouse_focus_animation = none
        shrink_percentage = 0.97
    }

    overview {
        panelColor = $bar_bg
        panelBorderColor = $outline_dim
        panelBorderWidth = 1
        panelHeight = 180
        workspaceActiveBorder = $primary
        workspaceInactiveBorder = $outline_dim
        workspaceBorderSize = 2
        centerAligned = true
        onBottom = false
        showNewWorkspace = true
        showEmptyWorkspace = true
        exitOnClick = true
        switchOnDrop = true
        # gesture is bound explicitly below (4 fingers); keep 3-finger workspace swipe untouched
        disableGestures = true
    }

    dynamic-cursors {
        enabled = true
        mode = tilt
        tilt {
            limit = 5000
            activation = negative_quadratic
        }
        shake {
            enabled = true
        }
        # re-render SVG hyprcursor at magnified size so shake-grow stays sharp
        hyprcursor {
            enabled = true
            nearest = false
            resolution = -1
            fallback = clientside
        }
    }

    hyprglass {
        # off by default; scripts/glass-float-sync.sh tags floating windows hyprglass_enabled
        enabled = 0
        default_theme = dark
        default_preset = pomme
        tint_color = $glass_tint
        # Liquid Glass engine (web version: backdrop-filter: url(#displace) blur(1.5px) saturate(150%)
        # brightness(0.85 dark / 1.2 light), no tint):
        #   blur 1.5px = sigma 1.5 = blur_strength 0.375 x 1 pass (hyprglass: radius = strength * 12, sigma = radius / 3)
        # Added on top: the thin rim highlight (bevel) real Liquid Glass has.
        preset = name:macshell, inherits:pomme, blur_strength:0.375, blur_iterations:1, chromatic_aberration:0, contrast:1.0, saturation:1.5, bevel_strength:0.85, bevel_size:1.5, bevel_tint:0.25, specular_strength:0.5, fresnel_strength:0.15
        # dark: + adaptive tint (darken over bright content, lift over dark) so the glass never goes flat
        preset = name:macshell:dark, tint_color:0x00000000, brightness:0.85, contrast:1.0, saturation:1.5, adaptive_dim:0.2, adaptive_boost:0.1
        preset = name:macshell:light, tint_color:0x00000000, brightness:1.2, contrast:1.0, saturation:1.5
        # the menu bar sits under small text and icons: more frost there keeps them readable
        preset = name:macshellbar, inherits:macshell, blur_strength:0.6
        # menus, Control Center, Spotlight: Apple's frostier "regular" glass so their text stays readable
        preset = name:macshellpanel, inherits:macshell, blur_strength:1.2, blur_iterations:2
        # Rim refraction (local fork, ~/.local/src/HyprGlass), bevel `depth` px wide.
        # profile 0 = the engine's displacement map (getDisplacementFilter: depth 10, strength 80, yScale 0.75);
        # profile 1 = thick convex glass: squircle bezel + Snell's law (strength 100 = physical shift).
        # The bevel's corner radius is the shape's own (layers:namespace_radii), as the engine reads border-radius.
        displacement {
            profile = 0
            ior = 1.5
            strength = 80
            depth = 10
            y_scale = 0.75
            # Apple's rim catches the light on both ends of the light axis
            mirror_highlight = 1.0
        }
        layers {
            enabled = 1
            # notifications excluded: glass edge left stray pixels outside dunst's rounded pill
            # MacShell: menu bar (macbarbg), Dock, popovers/menus/Control Center (macbar), Spotlight (macspot),
            # Alt+Tab switcher (macswitch), wallpaper picker (macwall)
            namespaces = waybar, rofi, macbarbg, macdock, macbar, macspot, macswitch, macwall
            # bar and Dock send their exact shape (ext-background-effect); macbar's region is only the popover
            # area under the bar, so the bar's own text never gets glass
            namespace_mask_modes = macbarbg=region, macdock=region, macbar=region
            namespace_radii = macbarbg=0, macdock=18
            # shape maps (fork): every tile, button, menu and field is its own glass shape, taken from what
            # MacShell draws (follows open/close animations); full glass from the threshold alpha up
            namespace_shape_maps = macbar, macspot, macswitch, macwall
            namespace_mask_thresholds = macbar=0.08, macspot=0.08, macswitch=0.08, macwall=0.08
            namespace_presets = macbarbg:macshellbar, macdock:macshell, macbar:macshellpanel, macspot:macshellpanel, macswitch:macshellpanel, macwall:macshellpanel
            # the 28 px bar pulls less than the dock pill
            namespace_displacement = macbarbg=0.25
            # re-render on every frame something behind changes (default caps at 30 fps); static scenes stay free
            live_resample_fps = 0
        }
    }
}


animation = hyprfocusIn, 1, 1.7, overshot
animation = hyprfocusOut, 1, 1.7, overshot

bind = $mod, Tab, overview:toggle
gesture = 4, up, dispatcher, overview:toggle

# hyprlang noerror false
