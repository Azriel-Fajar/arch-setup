source = ~/.config/hypr/colors.conf

background {
    monitor =
    path = /home/azriel/Videos/wallpaper_1080p.mp4
    blur_passes = 0
}

# Glass card behind clock, date and input
shape {
    monitor =
    size = 460, 500
    color = $glass_card
    rounding = 24
    border_size = 1
    border_color = $outline_dim
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    rounding = -1
    outline_thickness = 2
    dots_size = 0.16
    dots_spacing = 0.5
    dots_center = true
    outer_color = $primary
    inner_color = $glass_card
    font_color = $on_surface
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = $tertiary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $on_surface
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
