# Lock screen mirrors the SDDM login page (sddm/macos/Main.qml): same wallpaper,
# clock on top, avatar, name and a pill password field in the middle.
# Sizes assume the 1920x1200 panel the QML is tuned against.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    # wallpaper.sh keeps this copy in sync, so lock and login always match
    path = /usr/share/sddm/themes/macos/background.jpg
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] date +"%A %-d %B"
    color = rgba(ffffffe6)
    font_size = 26
    font_family = Inter Display SemiBold
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffe0)
    font_size = 138
    font_family = Inter Display SemiBold
    position = 0, -105
    halign = center
    valign = top
}

# Avatar from ~/.face
image {
    monitor =
    path = /home/azriel/.face
    size = 76
    rounding = -1
    border_size = 0
    position = 0, 52
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] id -un
    color = rgba(ffffffff)
    font_size = 16
    font_family = Inter SemiBold
    position = 0, -8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 212, 32
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(ffffff38)
    inner_color = rgba(ffffff29)
    font_color = rgba(ffffffff)
    font_family = Inter
    check_color = rgba(ffffff38)
    fail_color = rgba(ffffff38)
    capslock_color = rgba(ffffff38)
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    fail_text = <span foreground="##ffffffbf">Incorrect password</span>
    position = 0, -46
    halign = center
    valign = center
}
