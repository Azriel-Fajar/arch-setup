# Liquid-glass look. Colors come from colors.conf (generated by matugen via scripts/wallpaper.sh).

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $primary_a $tertiary_a 45deg
    col.inactive_border = $outline_dim
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.90
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        brightness = 0.9
        vibrancy = 0.2
        popups = true
    }

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = $shadow_a
    }
}

animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = linear, 0, 0, 1, 1
    animation = windows, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, glass, popin 80%
    animation = border, 1, 8, glass
    # no `loop`: a forever-spinning border redraws (and re-blurs) the whole screen at 60 fps, which left the UHD 620
    # no headroom for workspace switches
    animation = borderangle, 1, 8, glass
    animation = fade, 1, 4, glass
    animation = layers, 1, 4, glass, slide
    # 300 ms: the glass stack renders at ~30 fps during a switch on this throttled UHD 620, so keep it short
    animation = workspaces, 1, 3, glass, slidefade 15%
}

# Stay fully opaque: browsers, media, games, image viewers
windowrule = match:class ^(firefox|google-chrome|Google-chrome|chromium|brave-browser|mpv|vlc|imv|org.gnome.Loupe|org.kde.gwenview|org.vinegarhq.Sober|steam)$, opaque on
# Chrome web apps (Wayland: chrome-<id>-Default, X11: crx_<id>)
windowrule = match:class ^(chrome-.*|crx_.*)$, opaque on
windowrule = match:class ^(steam_app_.*)$, opaque on
windowrule = match:content 2, opaque on
windowrule = match:content 3, opaque on
# Kitty handles its own transparency (background_opacity in kitty.conf) so text stays crisp
windowrule = match:class ^(kitty)$, opaque on

# Blur behind bar, launcher and notifications
layerrule = match:namespace ^(waybar|rofi|notifications|logout_dialog)$, blur on
layerrule = match:namespace ^(waybar|rofi|notifications)$, ignore_alpha 0.3
# Kitty drop-down terminal (kitten quick-access-terminal)
layerrule = match:namespace ^(kitty-quick-access)$, blur on

# MacShell (quickshell): hyprglass (plugins.conf) draws all its glass, so no Hyprland blur here: it would be
# drawn into the layer on top of the glass (and from a stale cached wallpaper blur). No fade on the screenshot picker.
layerrule = match:namespace ^(macdock|macspot|macbarbg|macshot)$, no_anim on
