include colors.conf

# zsh when installed, else bash (works before chsh/relogin; zshrc loads kitty integration itself)
shell sh -c 'exec "$(command -v zsh || command -v bash)"'

# ── Font ────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font cell_height 115%
disable_ligatures cursor

# ── Window ──────────────────────────────────────────
background_opacity 0.75
dynamic_background_opacity yes
window_padding_width 10 14
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
enabled_layouts splits,stack
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.85

# ── Cursor ──────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 2
# No blink: blinking forces constant redraws while idle
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.08 0.3
cursor_trail_start_threshold 3

# ── Tab bar ─────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_margin_height 4 0
tab_title_template "{fmt.bold}{index}{fmt.nobold}  {title[:30]}{' 󰊓' if layout_name == 'stack' and num_windows > 1 else ''}"

# ── Behaviour ───────────────────────────────────────
scrollback_lines 20000
scrollback_pager_history_size 64
# Touchpad: offsets Hyprland's scroll_factor 0.3; mouse wheel: lines per notch (default 5)
touch_scroll_multiplier 2.5
wheel_scroll_multiplier 8.0
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
url_style curly
undercurl_style thick-sparse
strip_trailing_spaces smart
shell_integration enabled
notify_on_cmd_finish unfocused 15.0

# ── Keys ────────────────────────────────────────────
# Kitty defaults kept: ctrl+shift+z/x jump prompts, ctrl+shift+g last output,
# ctrl+shift+e open URL, ctrl+shift+p>f/l/w insert path/line/word,
# ctrl+shift+a>m/l opacity, ctrl+shift+equal/minus font size
# Splits (open in current directory)
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+alt+v       launch --location=vsplit --cwd=current
map ctrl+alt+s       launch --location=hsplit --cwd=current
map ctrl+shift+t     new_tab_with_cwd
# Move between splits
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
# Zoom current split
map ctrl+alt+z toggle_layout stack
