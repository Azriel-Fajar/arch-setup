"$schema" = 'https://starship.rs/config-schema.json'

# Colors are ANSI names, so they follow kitty's matugen palette
add_newline = true
format = """
$directory$git_branch$git_status$python$nodejs$rust$c$cmd_duration
$character"""
right_format = "$jobs$status"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"

[status]
disabled = false
symbol = "✘ "
style = "red"
format = "[$symbol$status]($style)"

[jobs]
symbol = " "
style = "cyan"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "yellow"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "green"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "red"

[c]
symbol = " "
format = "[$symbol$version]($style) "
