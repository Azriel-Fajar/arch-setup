[config]
# Pick the most dominant color without the interactive chooser (script runs non-interactively)
source_color_index = 0

# Terminal ANSI hues; matugen harmonizes them toward the wallpaper color
[config.custom_colors]
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
# No [config.wallpaper]: wallpaper.sh sets the wallpaper itself with awww

# colors.lua: Hyprland 0.55+ Lua config; colors.conf: hyprlock (still hyprlang)
[templates.hypr]
input_path = "./templates/hypr-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.hypr_lua]
input_path = "./templates/hypr-colors.lua"
output_path = "~/.config/hypr/colors.lua"

[templates.waybar]
input_path = "./templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.rofi]
input_path = "./templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.dunst]
input_path = "./templates/dunstrc"
output_path = "~/.config/dunst/dunstrc"

[templates.kitty]
input_path = "./templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
